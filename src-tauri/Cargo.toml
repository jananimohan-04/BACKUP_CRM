[package]
name = "cncforge-erp"
version = "1.0.0"
description = "CNCFORGE ERP — Windows desktop application"
authors = ["CNCFORGE"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "cncforge_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Windows release profile: smaller binary, deterministic linking.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
